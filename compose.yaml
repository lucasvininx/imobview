services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: imobview
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: imobview
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - imobview_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobview -d imobview"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  imobview_postgres:
